# OSM POI export pipeline (Overture Schema): PBF -> GeoParquet (DuckDB-based, no Java)
# Converts cached OSM PBF artifacts from the osm-download pipeline (definition 3)
# into ZSTD-compressed GeoParquet files containing POI features (amenity, shop, tourism, leisure, etc.).
#
# Prerequisites:
#   The osm2parquet Docker image must be built and pushed to both registries:
#     docker build -t krizleebear/osm2pois:vX.Y.Z docker/osm2parquet/
#     docker push krizleebear/osm2pois:vX.Y.Z                   # Docker Hub
#     docker tag krizleebear/osm2pois:vX.Y.Z ghcr.io/krizleebear/osm2pois:vX.Y.Z
#     docker push ghcr.io/krizleebear/osm2pois:vX.Y.Z           # GHCR (primary)
#   GHCR is used as primary registry (no rate limits, no mirror.gcr.io flakiness).
#   mirror.gcr.io is retained as fallback in the warmup job.
#
# Stages:
#   warmup  -- Verify container image availability & host disk reclaim
#   convert -- Per-region PBF -> Parquet conversion (Container-Job-Pattern)
trigger: none
pr: none

parameters:
- name: publishGitHubRelease
  displayName: 'Publish GitHub Release with GeoParquet assets'
  type: boolean
  default: true
- name: skipOsmiumFilter
  displayName: 'Skip Osmium filtering (use pre-filtered pois.pbf pipeline artifacts)'
  type: boolean
  default: false
- name: downloadBuildId
  displayName: 'Specific build ID of osm-download-pbf pipeline (definition 9) or latest'
  type: string
  default: 'latest'
- name: prefilteredBuildId
  displayName: 'Specific build ID of osm-pois pipeline (definition 10) for pre-filtered pois.pbf or latest'
  type: string
  default: 'latest'

pool:
  vmImage: 'ubuntu-latest'

resources:
  containers:
  # Primary registry: GHCR (no rate limits, no mirror.gcr.io flakiness).
  # Fallback: mirror.gcr.io is attempted in the warmup job for cache pre-warming.
  - container: osm2parquet
    image: ghcr.io/krizleebear/osm2parquet:v1.1.0

stages:
# ---------------------------------------------------------------------------
# Stage 1: Fast-Fail Preflight & Container Image Verification
# Pulls from GHCR (primary). Falls back to mirror.gcr.io if GHCR is
# unavailable. Validates pipeline YAML and runs unit tests in container.
# ---------------------------------------------------------------------------
- stage: preflight
  displayName: 'Fast-Fail Preflight & Image Verification'

  jobs:
  - job: preflight
    displayName: 'YAML validation, image pull & unit tests'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Validate pipeline YAML syntax'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          echo "[INFO] Validating azure-pipelines.yml syntax..."
          python3 -c "import yaml; yaml.safe_load(open('azure-pipelines.yml'))"
          echo "[OK] azure-pipelines.yml syntax is valid."
          echo "[INFO] Running pipeline matrix & canonical URL invariants..."
          python3 -m unittest tests/test_pipeline_matrix.py
          echo "[OK] Pipeline matrix & URL invariants passed."

    - task: Bash@3
      displayName: 'Verify image pull (GHCR primary, mirror.gcr.io fallback)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          GHCR_IMAGE="ghcr.io/krizleebear/osm2parquet:v1.1.0"
          MIRROR_IMAGE="mirror.gcr.io/krizleebear/osm2parquet:v1.1.0"

          pull_with_retry() {
            local IMAGE="$1"
            local MAX_RETRIES=3
            local RETRY_COUNT=0
            until docker pull "$IMAGE"; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "[WARN] Pull failed for $IMAGE after $MAX_RETRIES attempts."
                return 1
              fi
              echo "[WARN] Pull failed for $IMAGE. Retrying in 15 seconds ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep 15
            done
            return 0
          }

          ACTIVE_IMAGE=""
          echo "[INFO] Attempting pull from GHCR (primary): $GHCR_IMAGE"
          if pull_with_retry "$GHCR_IMAGE"; then
            echo "[OK] Image available on GHCR."
            ACTIVE_IMAGE="$GHCR_IMAGE"
          else
            echo "[WARN] GHCR unavailable. Attempting fallback: $MIRROR_IMAGE"
            if pull_with_retry "$MIRROR_IMAGE"; then
              echo "[OK] Image available on mirror.gcr.io (fallback)."
              ACTIVE_IMAGE="$MIRROR_IMAGE"
            fi
          fi

          if [ -z "$ACTIVE_IMAGE" ]; then
            echo "****************************************************************"
            echo " ERROR: Failed to pull image from both registries!"
            echo "   Primary:  $GHCR_IMAGE"
            echo "   Fallback: $MIRROR_IMAGE"
            echo " Remediation: Verify that the image is published on GHCR and"
            echo "   Docker Hub, and that mirror.gcr.io has no ongoing outage."
            echo "****************************************************************"
            exit 1
          fi

          echo "[INFO] Executing fast-fail DuckDB unit tests in container..."
          docker run --rm -v "$(pwd):/workspace" -w /workspace "$ACTIVE_IMAGE" ./tests/run_unit_tests.sh
          echo "[OK] Preflight unit tests passed successfully."

    - task: Bash@3
      displayName: 'Verify host disk reclaim'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          echo "=== DISK SPACE BEFORE RECLAIM ==="
          df -h /
          echo ""
          echo "[INFO] Removing unused pre-installed SDKs (.NET, Android, GHC, Boost, toolcache)..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            2>/dev/null || true
          echo ""
          echo "=== DISK SPACE AFTER RECLAIM ==="
          df -h /

# ---------------------------------------------------------------------------
# Stage 2: Convert PBF -> GeoParquet (per region, parallel matrix)
# ---------------------------------------------------------------------------
- stage: convert
  displayName: 'Convert OSM PBF to GeoParquet'
  dependsOn: preflight
  condition: succeeded('preflight')

  jobs:
  # -------------------------------------------------------------------------
  # Job 1: Touchstone Build for Germany (DE) - runs first and exclusively
  # -------------------------------------------------------------------------
  - job: touchstone_germany
    displayName: 'PBF -> Parquet DE (Touchstone)'
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm2parquet
    variables:
      OSM_REGION: 'germany'
      PBF_URL: 'https://download.geofabrik.de/europe/germany/germany-latest.osm.pbf'
      COUNTRY_CODE: 'DE'
    steps:
    - template: templates/convert-steps.yml
      parameters:
        downloadBuildId: ${{ parameters.downloadBuildId }}
        prefilteredBuildId: ${{ parameters.prefilteredBuildId }}
        skipOsmiumFilter: ${{ parameters.skipOsmiumFilter }}

  # -------------------------------------------------------------------------
  # Job 2: Touchstone Build for United States (US) - runs after DE
  # -------------------------------------------------------------------------
  - job: touchstone_us
    displayName: 'PBF -> Parquet US (Touchstone)'
    dependsOn: touchstone_germany
    condition: succeededOrFailed()
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm2parquet
    variables:
      OSM_REGION: 'us'
      PBF_URL: 'https://download.geofabrik.de/north-america/us/us-latest.osm.pbf'
      COUNTRY_CODE: 'US'
    steps:
    - template: templates/convert-steps.yml
      parameters:
        downloadBuildId: ${{ parameters.downloadBuildId }}
        prefilteredBuildId: ${{ parameters.prefilteredBuildId }}
        skipOsmiumFilter: ${{ parameters.skipOsmiumFilter }}

  # -------------------------------------------------------------------------
  # Job 3: Convert remaining regions (parallel matrix, starts after Touchstones)
  # -------------------------------------------------------------------------
  - job: convert
    displayName: 'PBF -> Parquet'
    dependsOn:
    - touchstone_germany
    - touchstone_us
    condition: succeededOrFailed()
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm2parquet

