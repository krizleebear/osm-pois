# ---------------------------------------------------------------------------
# Stage 3: Publish GitHub Release (optional, driven by parameter)
# ---------------------------------------------------------------------------
- stage: release
  displayName: 'Publish GitHub Release'
  dependsOn: convert
  condition: and(succeeded('convert'), ${{ eq(parameters.publishGitHubRelease, true) }})
  jobs:
  - job: release
    displayName: 'Create GitHub Release with GeoParquet Assets'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download all places-parquet artifacts'
      inputs:
        itemPattern: 'places-parquet-*/**'
        targetPath: '$(Pipeline.Workspace)/release_assets'

    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
        repositoryName: 'krizleebear/osm-pois'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(Build.BuildNumber)'
        title: 'Release $(Build.BuildNumber)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          Automated worldwide OpenStreetMap (OSM) to Overture Places-compatible GeoParquet release.

          - **Build:** `$(Build.BuildNumber)`
          - **Commit:** `$(Build.SourceVersion)`
          - **Schema:** [Overture Maps Places](https://overturemaps.org/schema/) (`theme=places / type=place`)

          ---

          ### 📜 Attribution & Licensing Notice

          This dataset contains information from **OpenStreetMap**, which is made available under the **Open Database License (ODbL) 1.0**.

          - **Data Origin & Copyright:** © [OpenStreetMap contributors](https://www.openstreetmap.org/copyright)
          - **Data License:** [Open Data Commons Open Database License (ODbL) 1.0](https://opendatacommons.org/licenses/odbl/)
          - **Schema Specification:** [Overture Maps Foundation](https://overturemaps.org/) (`theme=places / type=place`, [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/))
          - **Taxonomy Mappings:** Derived from the [Cadence Maps](https://gitlab.com/geometalab/bafs25-cadencemaps) project (MIT License)
          - **Compiler Pipeline:** [osm-pois](https://github.com/krizleebear/osm-pois)

          #### Downstream Attribution Requirements
          Any public use, publication, display, or redistribution of these GeoParquet files or derivative works must clearly and prominently credit OpenStreetMap:
          > **"Data © OpenStreetMap contributors, available under the Open Database License (ODbL)."**
          >
          > When using these datasets electronically, you must include a hyperlink directly to [https://www.openstreetmap.org/copyright](https://www.openstreetmap.org/copyright) and [https://opendatacommons.org/licenses/odbl/](https://opendatacommons.org/licenses/odbl/).

          #### Embedded Metadata
          Each `.places.parquet` file contains embedded provenance and licensing metadata in its Parquet header/footer (`attribution`, `license`, `source`, `origin`, `schema_license`, `schema_attribution`, `compiler`, `country_code`, `exported_at`), as well as feature-level provenance in the `sources` array (`dataset: 'OpenStreetMap'`, `license: 'ODbL-1.0'`, `record_id`, `update_time`).
        assets: '$(Pipeline.Workspace)/release_assets/**/*.parquet'
        addChangeLog: false



