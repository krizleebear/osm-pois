services:
  dev:
    image: osm-pois:dev
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        CACHEBUST_AGY: ${CACHEBUST_AGY:-}
    environment:
      TERM: xterm-256color
      TZ: Europe/Berlin
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GH_TOKEN:-}}
      TERM_PROGRAM: ${TERM_PROGRAM:-}
      TERM_PROGRAM_VERSION: ${TERM_PROGRAM_VERSION:-}
      LC_TERMINAL: ${LC_TERMINAL:-}
      LC_TERMINAL_VERSION: ${LC_TERMINAL_VERSION:-}
      ITERM_SESSION_ID: ${ITERM_SESSION_ID:-}
      COLORTERM: ${COLORTERM:-truecolor}
      DISPLAY: ${DISPLAY:-host.docker.internal:0}
      MAC_CLIPBOARD_HOST: host.docker.internal
      MAC_CLIPBOARD_PORT: "4215"
      MAC_CLIPBOARD_TOKEN: ${MAC_CLIPBOARD_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ~/.gitconfig:/home/ubuntu/.gitconfig:ro
      - ~/.gemini:/home/ubuntu/.gemini
      - ~/.config/gh:/home/ubuntu/.config/gh
      - opencode-config:/home/ubuntu/.config/opencode
      - opencode-data:/home/ubuntu/.local/share/opencode
      - opencode-cache:/home/ubuntu/.cache
    working_dir: /app
    ports:
      - "4213:4213"
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

volumes:
  opencode-config:
  opencode-data:
  opencode-cache:
